
name: Deploy Liger Gym Frontend

on:
  push:
    branches:
      - master

jobs:
  deploy_production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect with VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            mkdir -p ~/apps/ligergym-frontend
            cd ~/apps/ligergym-frontend

            if [ -d ".git" ]; then
              echo "Pulling latest changes..."
              git stash
              git pull origin master
            else
              echo "Cloning frontend repository..."
              git clone -b master https://github.com/yonathanth/liger-front.git .
            fi

            echo "Installing dependencies..."
            npm install --force

            echo "Building frontend..."
            npm run build

            echo "Starting frontend on port 3233..."
            # Delete and re-create so a port change takes effect (restart keeps the old args)
            if pm2 describe ligergym-frontend > /dev/null 2>&1; then
              pm2 delete ligergym-frontend
            fi
            PORT=3233 pm2 start npm --name "ligergym-frontend" -- start -- -p 3233

            pm2 save
